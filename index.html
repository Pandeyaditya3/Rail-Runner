<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rail Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#120c26;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--bg:#120c26}}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
</style></head><body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Rubik","Segoe UI",system-ui,sans-serif';
let W,H,hy,by,laneW,unit,SA=0,S=1;
const F=8;
let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
let layers=[],stars=[];
function buildSky(){
  seed=7;stars=[];for(let i=0;i<70;i++)stars.push({x:R(),y:R()*.8,r:R()*1.4+.3,p:R()*6});
  layers=[{k:.12,c:'#6fa886',a:.9,h:[40,110],w:[34,70]},{k:.35,c:'#2a6444',a:1,h:[60,170],w:[44,90]}].map(L=>{
    const bs=[];for(let i=0;i<34;i++){const w=L.w[0]+R()*(L.w[1]-L.w[0]),h=L.h[0]+R()*(L.h[1]-L.h[0]);
      const cols=Math.max(2,Math.floor(w/12)),rows=Math.max(2,Math.floor(h/16)),win=[];
      for(let j=0;j<cols*rows;j++)win.push(R()<.3);bs.push({w,h,cols,rows,win})}
    return{...L,bs}});
}
function resize(){const r=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0);
  hy=H*0.3;by=H*0.82;laneW=Math.min(W*0.28,H*0.2);unit=laneW*0.55;S=Math.max(.6,H/700);
  SA=parseFloat(getComputedStyle(document.documentElement).paddingTop)||0;buildSky()}
addEventListener('resize',resize);resize();
let best=0;try{best=+localStorage.getItem('rr_best')||0}catch(e){}
let paused=false,mode='menu',objs,p,speed,dist,coins,spawn,t=0,parts=[],shake=0,newBest=false,dustT=0;
// sound
let ac;function snd(f,d,type,v,f2){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,n);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.08,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}
function reset(){paused=false;objs=[];p={lane:0,x:0,y:0,vy:0,roll:0};speed=14;dist=0;coins=0;spawn=20;newBest=false;parts=[];mode='play'}
function proj(d){const s=F/(F+d);return{s,y:hy+(by-hy)*s}}
function X(lane,s){return W/2+lane*laneW*s}
function spawnRow(){
  const d=70,r=Math.random(),free=Math.floor(Math.random()*3)-1;
  if(r<0.35){
    for(let l=-1;l<=1;l++)if(l!==free&&Math.random()<0.8)objs.push({t:'train',lane:l,d,len:6});
    objs.push({t:'coin',lane:free,d:d+1});objs.push({t:'coin',lane:free,d:d+3});objs.push({t:'coin',lane:free,d:d+5});
  }else if(r<0.65){
    const l=Math.floor(Math.random()*3)-1;
    objs.push({t:'low',lane:l,d,len:.5});
    for(let i=0;i<4;i++)objs.push({t:'coin',lane:l,d:d-2+i*1.4,air:i>0&&i<3});
  }else if(r<0.85){
    const l=Math.floor(Math.random()*3)-1;
    objs.push({t:'high',lane:l,d,len:.5});
  }else{
    const l=Math.floor(Math.random()*3)-1;
    for(let i=0;i<6;i++)objs.push({t:'coin',lane:l,d:d+i*1.6});
  }
}
function burst(x,y,n,cols,sp,life){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(.3+Math.random())*sp;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,l:life,m:life,c:cols[i%cols.length],r:1.5+Math.random()*2.5})}}
function move(dx){if(mode!=='play'||paused)return;p.lane=Math.max(-1,Math.min(1,p.lane+dx))}
function jump(){if(mode==='play'&&!paused&&p.y<=0.01){p.vy=11;p.roll=0;snd(300,.18,'sine',.1,640)}}
function roll(){if(mode!=='play'||paused)return;p.roll=0.7;snd(420,.16,'sine',.1,140);if(p.y>0.01)p.vy=-20}
function die(){mode='over';shake=.5;snd(170,.6,'sawtooth',.12,35);
  burst(X(p.x,1),by-unit*.8,34,['#ef4444','#facc15','#fb923c','#fff'],unit*5,.8);
  if(Math.floor(dist)>best){newBest=true;best=Math.floor(dist);try{localStorage.setItem('rr_best',best)}catch(e){}}}
function update(dt){
  if(paused)return;t+=dt;shake=Math.max(0,shake-dt);
  for(const q of parts){q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=unit*9*dt}
  parts=parts.filter(q=>q.l>0);
  if(mode!=='play')return;
  dist+=speed*dt*0.1;speed=Math.min(36,speed+dt*0.3);
  spawn-=speed*dt;if(spawn<=0){spawnRow();spawn=16+Math.random()*8}
  p.x+=(p.lane-p.x)*Math.min(1,dt*14);
  p.vy-=34*dt;p.y+=p.vy*dt;if(p.y<0){p.y=0;p.vy=0}
  if(p.roll>0)p.roll-=dt;
  dustT-=dt;if(p.y<=.01&&dustT<=0){dustT=.07;burst(X(p.x,1)+(Math.random()-.5)*unit*.4,by,1,['#8b7ba8','#5b4b78'],unit*1.2,.35)}
  for(const o of objs){
    o.d-=speed*dt;
    if(o.dead||Math.abs(o.lane-p.x)>0.55)continue;
    if(o.t==='coin'){if(o.d<0.7&&o.d>-0.7){o.dead=1;coins++;snd(900,.12,'square',.04,1400);
      burst(X(o.lane,1),by-(o.air?1.6:.7)*unit,10,['#fde047','#fff','#f59e0b'],unit*2.6,.45)}}
    else if(o.t==='train'){if(o.d<0.4&&o.d>-o.len)return die()}
    else if(o.d<0.3&&o.d>-0.5){
      if(o.t==='low'&&p.y<0.8)return die();
      if(o.t==='high'&&p.roll<=0)return die();
    }
  }
  objs=objs.filter(o=>o.d>-7&&!o.dead);
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function glow(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function drawSky(sc){
  let g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#6db7d6');g.addColorStop(.6,'#b5e0d4');g.addColorStop(1,'#eef5cf');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hy);
  ctx.globalAlpha=1;
  const sx=W*.7,sr=Math.min(H*.1,W*.16);glow(sx,hy-sr*.3,sr*3,'rgba(255,250,200,.65)');
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,hy);ctx.clip();
  g=ctx.createLinearGradient(0,hy-sr*2,0,hy);g.addColorStop(0,'#fffde8');g.addColorStop(1,'#ffe680');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,hy-sr*.4,sr,0,7);ctx.fill();ctx.restore();
  for(const L of layers){
    const tw=L.bs.reduce((a,b)=>a+b.w*S,0);let x=-((sc*L.k*30)%tw),i=0;
    while(false){const b=L.bs[i%L.bs.length],bw=b.w*S,bh=b.h*S;
      const tx=x+bw/2;ctx.fillStyle=L.c;ctx.fillRect(tx-bw*.04,hy-bh*.15,bw*.08,bh*.15);
      for(let j=0;j<4;j++){const yb=hy-bh*.1-j*bh*.22,ww=bw*(1-j*.2);ctx.beginPath();ctx.moveTo(tx-ww/2,yb);ctx.lineTo(tx+ww/2,yb);ctx.lineTo(tx,yb-bh*.36);ctx.fill()}
      x+=bw;i++}
  }
}
function drawTrack(){
  ctx.fillStyle='#5f9a78';ctx.fillRect(0,hy-H*.025,W,H*.03);
  let g=ctx.createLinearGradient(0,hy,0,H);g.addColorStop(0,'#4c8a4a');g.addColorStop(1,'#173a22');
  ctx.fillStyle=g;ctx.fillRect(0,hy,W,H-hy);
  const sB=(H-hy)/(by-hy);
  g=ctx.createLinearGradient(0,hy,0,H);g.addColorStop(0,'#9a8a6c');g.addColorStop(1,'#5f5241');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(X(-1.5,0),hy);ctx.lineTo(X(1.5,0),hy);ctx.lineTo(X(1.5,sB),H);ctx.lineTo(X(-1.5,sB),H);ctx.fill();
  const off=(dist*10)%4;
  ctx.strokeStyle='#6b4f3a';
  for(let k=0;k<22;k++){const d=k*4-off+0.01,q=proj(Math.max(d,-F+1));ctx.lineWidth=Math.max(1,5*q.s);
    ctx.beginPath();ctx.moveTo(X(-1.45,q.s),q.y);ctx.lineTo(X(1.45,q.s),q.y);ctx.stroke()}
  for(const l of [-1.25,-.75,-.25,.25,.75,1.25]){
    ctx.strokeStyle='#2a2218';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(l,0),hy);ctx.lineTo(X(l,sB),H);ctx.stroke();
    ctx.strokeStyle='#d5dbe6';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(X(l,0),hy);ctx.lineTo(X(l,sB),H);ctx.stroke()}
  ctx.strokeStyle='#d9c9a0';ctx.lineWidth=3;
  for(const l of[-1.5,1.5]){ctx.beginPath();ctx.moveTo(X(l,0),hy);ctx.lineTo(X(l,sB),H);ctx.stroke()}
  // lamp posts
  for(let k=11;k>=0;k--){const d=k*7-(dist*10)%7+.01;if(d<-3)continue;const q=proj(Math.max(d,-F+1)),n=k+Math.floor(dist*10/7);ctx.globalAlpha=Math.max(0,Math.min(1,(80-d)/20));
    for(const sd of[-1,1]){const x=X(sd*(2.3+((n+(sd>0?1:0))%2)*.6),q.s),h=4.2*unit*q.s,tw=1.6*unit*q.s;
      ctx.fillStyle='#4a3322';ctx.fillRect(x-tw*.1,q.y-h*.2,tw*.2,h*.2);
      for(let j=0;j<3;j++){const y0=q.y-h*.15-j*h*.26,ww=tw*(1-j*.22);ctx.fillStyle=j%2?'#2f7a4a':'#1f5f36';ctx.beginPath();ctx.moveTo(x-ww/2,y0);ctx.lineTo(x+ww/2,y0);ctx.lineTo(x,y0-h*.38);ctx.fill()}
    }
  }
  ctx.globalAlpha=1;g=ctx.createLinearGradient(0,hy,0,hy+H*.16);g.addColorStop(0,'rgba(225,242,215,.6)');g.addColorStop(1,'rgba(225,242,215,0)');
  ctx.fillStyle=g;ctx.fillRect(0,hy,W,H*.16);
}
function drawTrain(o){
  const a=proj(Math.max(o.d,-F+1)),b=proj(o.d+o.len),w=laneW*.8,h=2.6*unit;
  const xa=X(o.lane,a.s),xb=X(o.lane,b.s),ha=h*a.s,hb=h*b.s,wa=w*a.s,wb=w*b.s;
  if(o.lane!==0){const g=o.lane<0?1:-1;
    const q=(f1,f2,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(xa+g*wa/2,a.y-f1*ha);ctx.lineTo(xa+g*wa/2,a.y-f2*ha);ctx.lineTo(xb+g*wb/2,b.y-f2*hb);ctx.lineTo(xb+g*wb/2,b.y-f1*hb);ctx.fill()};
    q(0,1,'#075985');q(.06,.2,'#0c2d48');q(.28,.34,'#f97316');q(.45,.8,'#fde68a')}
  let g=ctx.createLinearGradient(0,b.y-hb,0,a.y-ha);g.addColorStop(0,'#e0f2fe');g.addColorStop(1,'#7dd3fc');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(xa-wa/2,a.y-ha);ctx.lineTo(xa+wa/2,a.y-ha);ctx.lineTo(xb+wb/2,b.y-hb);ctx.lineTo(xb-wb/2,b.y-hb);ctx.fill();
  g=ctx.createLinearGradient(0,a.y-ha,0,a.y);g.addColorStop(0,'#38bdf8');g.addColorStop(1,'#0369a1');
  ctx.fillStyle=g;rr(xa-wa/2,a.y-ha,wa,ha,wa*.06);ctx.fill();
  ctx.fillStyle='#0b1220';rr(xa-wa*.38,a.y-ha*.9,wa*.76,ha*.38,wa*.05);ctx.fill();
  ctx.fillStyle='rgba(125,211,252,.3)';ctx.beginPath();ctx.moveTo(xa-wa*.3,a.y-ha*.52);ctx.lineTo(xa-wa*.12,a.y-ha*.88);ctx.lineTo(xa-wa*.02,a.y-ha*.88);ctx.lineTo(xa-wa*.2,a.y-ha*.52);ctx.fill();
  ctx.fillStyle='#f97316';ctx.fillRect(xa-wa/2,a.y-ha*.43,wa,ha*.06);
  for(const sx of[-1,1]){const lx=xa+sx*wa*.3,ly=a.y-ha*.24;glow(lx,ly,wa*.3,'rgba(255,240,170,.8)');
    ctx.fillStyle='#fffbe0';ctx.beginPath();ctx.arc(lx,ly,wa*.07,0,7);ctx.fill()}
  ctx.fillStyle='#0f172a';ctx.fillRect(xa-wa/2,a.y-ha*.08,wa,ha*.08);
}
function drawLow(o){
  const q=proj(Math.max(o.d,-F+1)),w=laneW*.8*q.s,h=.8*unit*q.s,x=X(o.lane,q.s)-w/2,y=q.y-h;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x+w/2,q.y,w*.6,h*.12,0,0,7);ctx.fill();
  ctx.save();rr(x,y,w,h,w*.05);ctx.clip();
  let g=ctx.createLinearGradient(0,y,0,q.y);g.addColorStop(0,'#fde047');g.addColorStop(1,'#d97706');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#1c1917';for(let i=-2;i<9;i++){ctx.beginPath();const sx=x+i*w/6;ctx.moveTo(sx,q.y);ctx.lineTo(sx+w/12,q.y);ctx.lineTo(sx+w/12+h*.5,y);ctx.lineTo(sx+h*.5,y);ctx.fill()}
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x,y,w,h*.12);ctx.restore();
}
function drawHigh(o){
  const q=proj(Math.max(o.d,-F+1)),w=laneW*.8*q.s,x=X(o.lane,q.s),top=q.y-1.7*unit*q.s,bh=.7*unit*q.s;
  ctx.fillStyle='rgba(220,38,38,.22)';ctx.beginPath();ctx.ellipse(x,q.y,w*.55,w*.07,0,0,7);ctx.fill();
  const pw=Math.max(2,w*.09);let g=ctx.createLinearGradient(0,top,0,q.y);g.addColorStop(0,'#94a3b8');g.addColorStop(1,'#334155');
  ctx.fillStyle=g;ctx.fillRect(x-w/2,top,pw,q.y-top);ctx.fillRect(x+w/2-pw,top,pw,q.y-top);
  ctx.save();rr(x-w/2-pw*.5,top,w+pw,bh,bh*.15);ctx.clip();ctx.fillStyle='#f8fafc';ctx.fillRect(x-w/2-pw,top,w+2*pw,bh);
  ctx.fillStyle='#dc2626';for(let i=-1;i<9;i++){const sx=x-w/2+i*w/6;ctx.beginPath();ctx.moveTo(sx,top+bh);ctx.lineTo(sx+w/12,top+bh);ctx.lineTo(sx+w/12+bh*.6,top);ctx.lineTo(sx+bh*.6,top);ctx.fill()}
  ctx.restore();
  const on=Math.sin(t*10)>0;if(on)glow(x,top-bh*.2,w*.4,'rgba(255,60,60,.8)');
  ctx.fillStyle=on?'#ff5252':'#7f1d1d';ctx.beginPath();ctx.arc(x,top-bh*.15,Math.max(2,w*.05),0,7);ctx.fill();
}
function drawCoin(o){
  const q=proj(Math.max(o.d,-F+1)),lift=o.air?1.6:.7,x=X(o.lane,q.s),y=q.y-lift*unit*q.s,r=unit*.22*q.s;
  const sp=Math.abs(Math.cos(t*5+o.d*.4)),rw=Math.max(r*.15,r*sp);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,q.y,r*.8,r*.2,0,0,7);ctx.fill();
  glow(x,y,r*2.4,'rgba(253,224,71,.5)');
  let g=ctx.createRadialGradient(x-rw*.3,y-r*.3,0,x,y,r);g.addColorStop(0,'#fff7ae');g.addColorStop(.5,'#fbbf24');g.addColorStop(1,'#b45309');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rw,r,0,0,7);ctx.fill();
  ctx.strokeStyle='#92400e';ctx.lineWidth=Math.max(1,r*.12);ctx.stroke();
  ctx.strokeStyle='rgba(146,64,14,.7)';ctx.beginPath();ctx.ellipse(x,y,rw*.6,r*.6,0,0,7);ctx.stroke();
}
function drawPlayer(){
  const u=unit,x=X(p.x,1),fy=by-p.y*u,rolling=p.roll>0,air=p.y>.01,sh=Math.max(.35,1-p.y*.25);
  ctx.fillStyle='rgba(0,0,0,'+.45*sh+')';ctx.beginPath();ctx.ellipse(x,by+3,u*.42*sh,u*.1*sh,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,fy);ctx.lineCap='round';
  if(rolling){ctx.translate(0,-u*.4);ctx.rotate(t*18);
    ctx.fillStyle='#dc2626';ctx.beginPath();ctx.arc(0,0,u*.4,0,7);ctx.fill();
    ctx.fillStyle='#92400e';rr(-u*.22,-u*.32,u*.44,u*.32,u*.07);ctx.fill();
    ctx.fillStyle='#3b2412';ctx.beginPath();ctx.arc(u*.1,u*.24,u*.16,0,7);ctx.fill();
    ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(u*.1,u*.2,u*.16,Math.PI,0);ctx.fill();
  }else{
    ctx.rotate((p.lane-p.x)*.22);
    const ph=t*16,L=u*.66,sw=Math.sin(ph),la=air?.4:0,lb=air?-.2:0;
    for(const [hx,a] of [[-.13,lb],[.13,la]]){const fx=hx*u+Math.sin(a)*L,fyy=-.65*u+Math.cos(a)*L;
      ctx.strokeStyle='#1e3a8a';ctx.lineWidth=u*.2;ctx.beginPath();ctx.moveTo(hx*u,-.65*u);ctx.lineTo(fx,fyy);ctx.stroke();
      ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.ellipse(fx,fyy+u*.02,u*.12,u*.07,0,0,7);ctx.fill()}
    let g=ctx.createLinearGradient(-u*.28,0,u*.28,0);g.addColorStop(0,'#b91c1c');g.addColorStop(.5,'#ef4444');g.addColorStop(1,'#b91c1c');
    ctx.fillStyle=g;rr(-u*.28,-1.3*u,u*.56,u*.7,u*.15);ctx.fill();
    ctx.fillStyle='#92400e';rr(-u*.2,-1.2*u,u*.4,u*.48,u*.08);ctx.fill();
    ctx.fillStyle='#78350f';ctx.fillRect(-u*.2,-1.02*u,u*.4,u*.03);ctx.fillStyle='#fbbf24';ctx.fillRect(-u*.04,-1.2*u,u*.08,u*.14);
    for(const [sd,a] of [[-1,-lb],[1,-la]]){const ax=sd*u*(air?.5:.4),ay=air?-1.2*u-u*.3:-.75*u-Math.sin(a)*u*.12;
      ctx.strokeStyle='#dc2626';ctx.lineWidth=u*.15;ctx.beginPath();ctx.moveTo(sd*u*.3,-1.2*u);ctx.lineTo(ax,ay);ctx.stroke();
      ctx.fillStyle='#fcd9b6';ctx.beginPath();ctx.arc(ax,ay,u*.07,0,7);ctx.fill()}
    ctx.fillStyle='#e8bd94';ctx.beginPath();ctx.arc(-u*.2,-1.45*u,u*.05,0,7);ctx.arc(u*.2,-1.45*u,u*.05,0,7);ctx.fill();
    ctx.fillStyle='#3b2412';ctx.beginPath();ctx.arc(0,-1.46*u,u*.21,0,7);ctx.fill();
    ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(0,-1.5*u,u*.22,Math.PI,0);ctx.fill();
    ctx.fillStyle='#ca8a04';ctx.fillRect(-u*.22,-1.51*u,u*.44,u*.04);
  }
  ctx.restore();
}
function txt(s,x,y,size,col,al,w){ctx.font=(w||800)+' '+size+'px '+FONT;ctx.textAlign=al||'center';ctx.fillStyle=col;ctx.fillText(s,x,y)}
function pill(x,y,w,h){ctx.fillStyle='rgba(18,12,38,.62)';rr(x,y,w,h,h/2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1.5;ctx.stroke()}
function hud(){
  const y0=SA+14,pw=Math.min(150,W*.4);
  pill(14,y0,pw,56);txt(String(Math.floor(dist||0)),28,y0+27,26,'#fff','left');txt('distance',28,y0+46,11,'#b8a9d9','left',500);
  pill(14,y0+64,86,34);ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(34,y0+81,8,0,7);ctx.fill();ctx.strokeStyle='#92400e';ctx.lineWidth=2;ctx.stroke();
  txt(String(coins||0),50,y0+88,19,'#fde68a','left');
  pill(W-14-96,y0,96,34);txt('Best '+best,W-14-48,y0+23,15,'#e9ddff','center',500);
}
function overlay(){
  ctx.fillStyle='rgba(12,7,30,.68)';ctx.fillRect(0,0,W,H);
  const cx=W/2,pulse=.5+.5*Math.sin(t*4),over=mode==='over',ts=Math.min(W*.13,64);
  let ty=H*.24;
  if(!over){
    const g=ctx.createLinearGradient(cx-ts*3,0,cx+ts*3,0);g.addColorStop(0,'#ffd36e');g.addColorStop(1,'#ff5f8f');
    ctx.font='800 '+ts+'px '+FONT;ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=ts*.14;ctx.strokeStyle='#2a0f4a';ctx.strokeText('RAIL RUNNER',cx,ty);
    ctx.fillStyle=g;ctx.fillText('RAIL RUNNER',cx,ty);
    txt('Dodge trains. Grab coins. Outrun the city.',cx,ty+30,Math.min(16,W*.04),'#d9ccf2','center',500);
  }else{
    ctx.font='800 '+ts+'px '+FONT;ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=ts*.14;ctx.strokeStyle='#2a0f4a';ctx.strokeText('CRASHED',cx,ty);
    ctx.fillStyle='#ff5a5f';ctx.fillText('CRASHED',cx,ty);
    const cw=Math.min(W*.8,300),cy=ty+28;pill(cx-cw/2,cy,cw,84);ctx.beginPath();
    txt(String(Math.floor(dist)),cx-cw/4,cy+42,34,'#fff');txt('distance',cx-cw/4,cy+64,12,'#b8a9d9','center',500);
    txt(String(coins),cx+cw/4,cy+42,34,'#fde68a');txt('coins',cx+cw/4,cy+64,12,'#b8a9d9','center',500);
    if(newBest)txt('New best!',cx,cy+112,20,'#facc15');
  }
  const bw=Math.min(W*.7,280),bh=56,by2=H*.5,sc=1+pulse*.04;
  ctx.save();ctx.translate(cx,by2+bh/2);ctx.scale(sc,sc);
  const g2=ctx.createLinearGradient(0,-bh/2,0,bh/2);g2.addColorStop(0,'#ffcf5a');g2.addColorStop(1,'#ff7a45');
  ctx.shadowColor='rgba(255,122,69,.6)';ctx.shadowBlur=24;ctx.fillStyle=g2;rr(-bw/2,-bh/2,bw,bh,bh/2);ctx.fill();ctx.shadowBlur=0;
  txt(over?'फिरसे खेलो ':'TAP TO START',0,8,22,'#3a1500');ctx.restore();
  const iw=Math.min(W*.82,330),iy=H*.62;pill(cx-iw/2,iy,iw,98);
  txt('Swipe left or right to change lane',cx,iy+27,14,'#e9ddff','center',500);
  txt('Swipe up to jump, down to roll',cx,iy+51,14,'#e9ddff','center',500);
  txt('Keyboard: arrows or WASD, space to jump',cx,iy+75,13,'#a89ac9','center',500);
}
function pauseBtn(){const cx=W-31,cy=SA+14+34+28;ctx.fillStyle='rgba(18,12,38,.62)';ctx.beginPath();ctx.arc(cx,cy,17,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(cx-6,cy-7,4,14);ctx.fillRect(cx+2,cy-7,4,14)}
function pauseUI(){ctx.fillStyle='rgba(12,7,30,.66)';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H*.4,r=46;
  ctx.shadowColor='rgba(255,122,69,.6)';ctx.shadowBlur=24;const g=ctx.createLinearGradient(0,cy-r,0,cy+r);g.addColorStop(0,'#ffcf5a');g.addColorStop(1,'#ff7a45');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#3a1500';ctx.beginPath();ctx.moveTo(cx-14,cy-24);ctx.lineTo(cx+26,cy);ctx.lineTo(cx-14,cy+24);ctx.fill();
  txt('PAUSED',cx,cy-r-24,38,'#fff');txt('Tap anywhere to resume',cx,cy+r+38,16,'#d9ccf2','center',500)}
function draw(){
  const sc=dist+(mode==='menu'?t*1.2:0);
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*24);
  drawSky(sc);drawTrack();
  const list=[...objs].sort((a,b)=>b.d-a.d);
  for(const o of list){if(o.d>80)continue;
    if(o.t==='coin')drawCoin(o);else if(o.t==='train')drawTrain(o);else if(o.t==='low')drawLow(o);else drawHigh(o)}
  if(mode!=='over'||shake>0)drawPlayer();
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;ctx.restore();
  let v=draw.vg;if(!v||v.width!==W||v.height!==H){v=draw.vg=document.createElement('canvas');v.width=W;v.height=H;const c=v.getContext('2d'),vr=c.createRadialGradient(W/2,H*.55,Math.min(W,H)*.35,W/2,H*.55,Math.max(W,H)*.75);vr.addColorStop(0,'rgba(0,0,0,0)');vr.addColorStop(1,'rgba(8,4,20,.55)');c.fillStyle=vr;c.fillRect(0,0,W,H)}
  ctx.drawImage(v,0,0,W,H);
  hud();if(mode!=='play')overlay();else if(paused)pauseUI();else pauseBtn();
}
// input
let sx,sy,st;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=performance.now()});
addEventListener('pointerup',e=>{
  if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.abs(dx)<25&&Math.abs(dy)<25){if(mode==='play'){paused=!paused;snd(paused?300:600,.1,'sine',.08)}else if(performance.now()-lastEnd>400){snd(500,.15,'sine',.08,900);reset()}return}
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else dy<0?jump():roll();
});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(mode==='play'&&(k==='p'||k==='escape')){paused=!paused;return}
  if(mode!=='play'){if((k===' '||k==='enter')&&performance.now()-lastEnd>400)reset();return}
  if(k==='arrowleft'||k==='a')move(-1);else if(k==='arrowright'||k==='d')move(1);
  else if(k==='arrowup'||k==='w'||k===' ')jump();else if(k==='arrowdown'||k==='s')roll();
});
let lastEnd=0,prevMode=mode,last=performance.now();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')paused=true});
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);
  if(prevMode==='play'&&mode==='over')lastEnd=n;prevMode=mode;draw();requestAnimationFrame(loop);
}
reset();mode='menu';requestAnimationFrame(loop);
</script></body></html>
