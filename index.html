<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rail Runner</title>
<style>
:root{box-sizing:border-box;--bg:#0b1020}
@media (prefers-color-scheme: dark){:root{--bg:#0b1020}}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style></head><body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,hy,by,laneW,unit;
const F=8;
function resize(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0);
hy=H*0.28;by=H*0.82;laneW=Math.min(W*0.28,H*0.2);unit=laneW*0.55}
addEventListener('resize',resize);resize();
let best=0;try{best=+localStorage.getItem('rr_best')||0}catch(e){}
let mode='menu',objs,p,speed,dist,coins,spawn,t=0;
function reset(){objs=[];p={lane:0,x:0,y:0,vy:0,roll:0};speed=14;dist=0;coins=0;spawn=20;mode='play'}
function proj(d){const s=F/(F+d);return{s,y:hy+(by-hy)*s}}
function X(lane,s){return W/2+lane*laneW*s}
function spawnRow(){
  const d=70,r=Math.random(),free=Math.floor(Math.random()*3)-1;
  if(r<0.35){ // train blocks (leave one lane free)
    for(let l=-1;l<=1;l++)if(l!==free&&Math.random()<0.8)objs.push({t:'train',lane:l,d,len:6});
    objs.push({t:'coin',lane:free,d:d+1});objs.push({t:'coin',lane:free,d:d+3});objs.push({t:'coin',lane:free,d:d+5});
  }else if(r<0.65){
    const l=Math.floor(Math.random()*3)-1;
    objs.push({t:'low',lane:l,d,len:.5});
    for(let i=0;i<4;i++)objs.push({t:'coin',lane:l,d:d-2+i*1.4,air:i>0&&i<3});
  }else if(r<0.85){
    const l=Math.floor(Math.random()*3)-1;
    objs.push({t:'high',lane:l,d,len:.5});
  }else{
    const l=Math.floor(Math.random()*3)-1;
    for(let i=0;i<6;i++)objs.push({t:'coin',lane:l,d:d+i*1.6});
  }
}
function move(dx){if(mode!=='play')return;p.lane=Math.max(-1,Math.min(1,p.lane+dx))}
function jump(){if(mode==='play'&&p.y<=0.01){p.vy=11;p.roll=0}}
function roll(){if(mode!=='play')return;p.roll=0.7;if(p.y>0.01)p.vy=-20}
function die(){mode='over';if(Math.floor(dist)>best){best=Math.floor(dist);try{localStorage.setItem('rr_best',best)}catch(e){}}}
function update(dt){
  t+=dt;if(mode!=='play')return;
  dist+=speed*dt*0.1;speed=Math.min(36,speed+dt*0.3);
  spawn-=speed*dt;if(spawn<=0){spawnRow();spawn=16+Math.random()*8}
  p.x+=(p.lane-p.x)*Math.min(1,dt*14);
  p.vy-=34*dt;p.y+=p.vy*dt;if(p.y<0){p.y=0;p.vy=0}
  if(p.roll>0)p.roll-=dt;
  for(const o of objs){
    o.d-=speed*dt;
    if(o.dead||Math.abs(o.lane-p.x)>0.55)continue;
    if(o.t==='coin'){if(o.d<0.7&&o.d>-0.7){o.dead=1;coins++}}
    else if(o.t==='train'){if(o.d<0.4&&o.d>-o.len)return die()}
    else if(o.d<0.3&&o.d>-0.5){
      if(o.t==='low'&&p.y<0.8)return die();
      if(o.t==='high'&&p.roll<=0)return die();
    }
  }
  objs=objs.filter(o=>o.d>-7&&!o.dead);
}
function box(lane,d,len,h,color,top,lift=0){
  const a=proj(Math.max(d,-F+1)),b=proj(d+len);
  const w=laneW*0.8,xa=X(lane,a.s),xb=X(lane,b.s);
  const ya=a.y-lift*unit*a.s,yb=b.y-lift*unit*b.s;
  const ha=h*unit*a.s,hb=h*unit*b.s;
  if(len>1){ctx.fillStyle=top;ctx.beginPath();
    ctx.moveTo(xa-w*a.s/2,ya-ha);ctx.lineTo(xa+w*a.s/2,ya-ha);
    ctx.lineTo(xb+w*b.s/2,yb-hb);ctx.lineTo(xb-w*b.s/2,yb-hb);ctx.fill()}
  ctx.fillStyle=color;ctx.fillRect(xa-w*a.s/2,ya-ha,w*a.s,ha);
  return{x:xa,y:ya,w:w*a.s,h:ha,s:a.s}
}
function drawPlayer(){
  const x=X(p.x,1),y=by-p.y*unit,rolling=p.roll>0,h=(rolling?0.7:1.5)*unit,w=unit*0.55;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(X(p.x,1),by+4,w*.7,w*.2,0,0,7);ctx.fill();
  const sw=Math.sin(t*16)*unit*0.18*(p.y>0?0:1);
  if(!rolling){ctx.fillStyle='#1e3a8a';ctx.fillRect(x-w*.4+sw,y-h*.4,w*.35,h*.4);ctx.fillRect(x+w*.05-sw,y-h*.4,w*.35,h*.4)}
  ctx.fillStyle='#ef4444';ctx.fillRect(x-w/2,y-h*(rolling?1:.85),w,h*(rolling?1:.5));
  ctx.fillStyle='#fcd9b6';ctx.beginPath();ctx.arc(x,y-h*(rolling?.9:.95),unit*.22,0,7);ctx.fill();
  ctx.fillStyle='#facc15';ctx.fillRect(x-unit*.24,y-h*(rolling?.9:.95)-unit*.2,unit*.48,unit*.1);
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#1e3a8a');g.addColorStop(1,'#f59e0b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hy);
  ctx.fillStyle='#334155';ctx.fillRect(0,hy,W,H-hy);
  // skyline
  ctx.fillStyle='#1e293b';for(let i=0;i<9;i++){const bh=20+((i*37)%50);ctx.fillRect(i*W/9,hy-bh,W/9-4,bh)}
  // road
  const sB=(H-hy)/(by-hy);
  ctx.fillStyle='#1f2937';ctx.beginPath();
  ctx.moveTo(X(-1.5,0),hy);ctx.lineTo(X(1.5,0),hy);ctx.lineTo(X(1.5,sB),H);ctx.lineTo(X(-1.5,sB),H);ctx.fill();
  // sleepers
  ctx.strokeStyle='#4b5563';ctx.lineWidth=2;
  const off=(dist*10)%4;
  for(let k=0;k<20;k++){const d=k*4-off+0.01,q=proj(Math.max(d,-F+1));ctx.lineWidth=Math.max(1,3*q.s);
    ctx.beginPath();ctx.moveTo(X(-1.5,q.s),q.y);ctx.lineTo(X(1.5,q.s),q.y);ctx.stroke()}
  // rails
  ctx.strokeStyle='#94a3b8';
  for(const l of [-1.25,-.75,-.25,.25,.75,1.25]){ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(l,0),hy);ctx.lineTo(X(l,sB),H);ctx.stroke()}
  // objects far→near
  const list=[...objs].sort((a,b)=>b.d-a.d);
  for(const o of list){
    if(o.d>80)continue;
    if(o.t==='coin'){const q=proj(Math.max(o.d,-F+1));const lift=o.air?1.6:.7;
      ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(X(o.lane,q.s),q.y-lift*unit*q.s,unit*.2*q.s,0,7);ctx.fill();
      ctx.strokeStyle='#b45309';ctx.lineWidth=2*q.s;ctx.stroke()}
    else if(o.t==='train'){const b=box(o.lane,o.d,o.len,2.6,'#0ea5e9','#7dd3fc');
      ctx.fillStyle='#fef9c3';ctx.fillRect(b.x-b.w*.35,b.y-b.h*.8,b.w*.7,b.h*.25);
      ctx.fillStyle='#0c4a6e';ctx.fillRect(b.x-b.w*.5,b.y-b.h*.15,b.w,b.h*.15)}
    else if(o.t==='low'){const b=box(o.lane,o.d,.5,.8,'#f97316','#fdba74');
      ctx.fillStyle='#fff';for(let i=0;i<4;i++)ctx.fillRect(b.x-b.w/2+i*b.w/4,b.y-b.h*.7,b.w/8,b.h*.4)}
    else{const q=proj(Math.max(o.d,-F+1)),w=laneW*.8*q.s;
      ctx.fillStyle='#64748b';ctx.fillRect(X(o.lane,q.s)-w/2,q.y-1.7*unit*q.s,w*.08,1.7*unit*q.s);
      ctx.fillRect(X(o.lane,q.s)+w/2-w*.08,q.y-1.7*unit*q.s,w*.08,1.7*unit*q.s);
      ctx.fillStyle='#dc2626';ctx.fillRect(X(o.lane,q.s)-w/2,q.y-1.7*unit*q.s,w,.7*unit*q.s)}
  }
  drawPlayer();
  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 20px system-ui,sans-serif';
  ctx.fillText('Score '+Math.floor(dist||0),16,38);ctx.fillStyle='#fbbf24';ctx.fillText('● '+(coins||0),16,64);
  ctx.textAlign='right';ctx.fillStyle='#cbd5e1';ctx.font='16px system-ui,sans-serif';ctx.fillText('Best '+best,W-16,38);
  if(mode!=='play'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.font='bold 38px system-ui,sans-serif';ctx.fillText(mode==='menu'?'Rail Runner':'Crashed!',W/2,H*.34);
    ctx.font='20px system-ui,sans-serif';
    if(mode==='over'){ctx.fillText('Score '+Math.floor(dist)+'   Coins '+coins,W/2,H*.34+36)}
    ctx.fillText('Tap to '+(mode==='menu'?'start':'play again'),W/2,H*.5);
    ctx.fillStyle='#cbd5e1';ctx.font='15px system-ui,sans-serif';
    ctx.fillText('Swipe ← → to change lane',W/2,H*.58);ctx.fillText('Swipe ↑ jump · ↓ roll',W/2,H*.58+24);
    ctx.fillText('Keys: arrows or WASD',W/2,H*.58+48);
  }
}
// input
let sx,sy,st;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=performance.now()});
addEventListener('pointerup',e=>{
  if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.abs(dx)<25&&Math.abs(dy)<25){if(mode!=='play'&&performance.now()-lastEnd>400)reset();return}
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else dy<0?jump():roll();
});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(mode!=='play'){if((k===' '||k==='enter')&&performance.now()-lastEnd>400)reset();return}
  if(k==='arrowleft'||k==='a')move(-1);else if(k==='arrowright'||k==='d')move(1);
  else if(k==='arrowup'||k==='w'||k===' ')jump();else if(k==='arrowdown'||k==='s')roll();
});
let lastEnd=0,prevMode=mode,last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);
  if(prevMode==='play'&&mode==='over')lastEnd=n;prevMode=mode;draw();requestAnimationFrame(loop);
}
reset();mode='menu';requestAnimationFrame(loop);
</script></body></html>
