
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RAIL RUNNER 3D</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;
 background:#07111f;
 font-family:Arial,sans-serif;
 color:white;
 touch-action:none;
}
canvas{display:block}
#hud{
 position:absolute;top:20px;left:20px;right:20px;
 display:flex;justify-content:space-between;
 pointer-events:none;
}
.panel{
 background:rgba(5,15,30,.7);
 border:1px solid rgba(255,255,255,.2);
 border-radius:14px;padding:12px 18px;
 backdrop-filter:blur(10px);
}
.label{font-size:11px;color:#94a3b8;letter-spacing:2px}
.value{font-size:23px;font-weight:900}
#menu{
 position:absolute;inset:0;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;
 background:linear-gradient(180deg,rgba(2,10,25,.25),rgba(2,10,25,.9));
 text-align:center;
}
h1{
 font-size:clamp(40px,10vw,76px);
 font-weight:1000;letter-spacing:-3px;
 margin:0;
 color:#facc15;
 text-shadow:0 5px 30px #f97316;
}
.subtitle{color:#cbd5e1;letter-spacing:5px;margin:10px}
button{
 border:0;border-radius:30px;
 padding:16px 45px;margin-top:25px;
 font-size:18px;font-weight:900;
 background:linear-gradient(90deg,#facc15,#f97316);
 color:#111827;
 box-shadow:0 8px 30px #f9731644;
}
#instructions{
 position:absolute;bottom:20px;
 width:100%;text-align:center;
 color:#cbd5e1;font-size:12px;
 pointer-events:none;
}
#controls{
 position:absolute;bottom:65px;
 left:0;right:0;display:flex;
 justify-content:space-around;
 pointer-events:none;
}
.ctrl{
 pointer-events:auto;
 width:55px;height:55px;padding:0;
 margin:0;border-radius:50%;
 background:#ffffff30;color:white;
 border:1px solid #ffffff55;
}
.hidden{display:none!important}
</style>
</head>

<body>

<div id="hud">
 <div class="panel">
  <div class="label">DISTANCE</div>
  <div class="value" id="score">0 m</div>
 </div>
 <div class="panel">
  <div class="label">COINS</div>
  <div class="value" id="coins">0</div>
 </div>
 <div class="panel">
  <div class="label">BEST</div>
  <div class="value" id="best">0</div>
 </div>
</div>

<div id="menu">
 <div style="font-size:45px">🚄</div>
 <h1>RAIL RUNNER</h1>
 <div class="subtitle">ULTIMATE 3D EDITION</div>
 <p id="message">Dodge trains. Collect coins. Run forever.</p>
 <button id="start">START RUN</button>
</div>

<div id="controls">
 <button class="ctrl" id="left">◀</button>
 <button class="ctrl" id="jump">▲</button>
 <button class="ctrl" id="slide">▼</button>
 <button class="ctrl" id="right">▶</button>
</div>

<div id="instructions">
 SWIPE TO MOVE · UP TO JUMP · DOWN TO SLIDE
</div>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x86b9e8);
scene.fog = new THREE.Fog(0x86b9e8,35,110);

const camera = new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,0.1,200
);
camera.position.set(0,6,12);
camera.lookAt(0,1,-12);

const renderer = new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xddeeff,0x334455,1.4));

const sun = new THREE.DirectionalLight(0xffffff,1.8);
sun.position.set(-10,20,10);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// MATERIALS
const mat=(color,roughness=.8,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const grass=mat(0x397c49);
const asphalt=mat(0x303b48);
const railMat=mat(0xb5c5d5,.3,.8);
const sleeperMat=mat(0x594b3c);
const gold=mat(0xffc400,.25,.7);

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(150,200),
 grass
);
ground.rotation.x=-Math.PI/2;
ground.position.z=-35;
ground.receiveShadow=true;
scene.add(ground);

// TRACK
const road=new THREE.Mesh(
 new THREE.BoxGeometry(9,.15,150),
 asphalt
);
road.position.set(0,-.12,-35);
road.receiveShadow=true;
scene.add(road);

// RAILS AND SLEEPERS
const sleepers=[];
for(let z=10;z>-140;z-=3){
 const s=new THREE.Mesh(
  new THREE.BoxGeometry(8,.13,.35),sleeperMat
 );
 s.position.set(0,-.02,z);
 scene.add(s);
 sleepers.push(s);
}

for(let lane of [-1,0,1]){
 const x=lane*2;
 for(let side of [-.65,.65]){
  const rail=new THREE.Mesh(
   new THREE.BoxGeometry(.12,.15,150),railMat
  );
  rail.position.set(x+side,.05,-35);
  scene.add(rail);
 }
}

// CITY BUILDINGS
const buildings=[];
for(let i=0;i<50;i++){
 for(let side of [-1,1]){
  const h=5+Math.random()*18;
  const b=new THREE.Mesh(
   new THREE.BoxGeometry(3,h,3+Math.random()*5),
   mat([0x475569,0x64748b,0x334155,0x52525b][i%4])
  );
  b.position.set(side*(9+Math.random()*8),h/2,-i*4);
  scene.add(b);
  buildings.push(b);
 }
}

// PLAYER
const player=new THREE.Group();
scene.add(player);
player.position.set(0,0,3);

const bodyMat=mat(0xef4444);
const skin=mat(0xf4c7a1);
const pants=mat(0x172554);
const shoe=mat(0x111827);

function cube(parent,w,h,d,material,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 parent.add(m);
 return m;
}

const torso=cube(player,.65,.85,.35,bodyMat,0,1.15,0);
const head=new THREE.Mesh(
 new THREE.SphereGeometry(.29,16,12),skin
);
head.position.y=1.85;
head.castShadow=true;
player.add(head);

const hair=cube(player,.55,.15,.4,mat(0x252525),0,2.06,0);

const legs=[];
for(let side of [-1,1]){
 const leg=cube(player,.23,.65,.25,pants,side*.19,.4,0);
 const foot=cube(player,.26,.16,.4,shoe,side*.19,.08,-.1);
 legs.push(leg);
}

const arms=[];
for(let side of [-1,1]){
 arms.push(cube(player,.18,.65,.2,skin,side*.46,1.15,0));
}

// OBJECTS
let obstacles=[];
let coinObjects=[];
let particles=[];
let lane=0;
let jumpY=0,jumpV=0;
let sliding=0;
let speed=17;
let distance=0;
let coins=0;
let running=false;
let over=false;
let clock=new THREE.Clock();

let best=Number(localStorage.getItem("railBest")||0);
document.getElementById("best").textContent=best;

function createTrain(){
 const group=new THREE.Group();

 cube(group,1.65,2.4,7,mat(0x0284c7,.35,.3),0,1.3,0);
 cube(group,1.5,.7,7.05,mat(0x7dd3fc),0,2.65,0);

 for(let z=-2.5;z<=2.5;z+=1.7){
  cube(group,.5,.55,.08,mat(0x0c2940,.2),0,1.8,z);
 }

 cube(group,1.7,.18,.15,mat(0xfacc15),0,.35,3.5);

 return group;
}

function createBarrier(type){
 const group=new THREE.Group();

 if(type==="low"){
  cube(group,1.7,.8,.6,mat(0xf97316),0,.4,0);
  cube(group,1.8,.15,.65,mat(0xffd28a),0,.7,0);
 }else{
  cube(group,.15,2,.2,mat(0x64748b),-.8,1,0);
  cube(group,.15,2,.2,mat(0x64748b),.8,1,0);
  cube(group,1.8,.65,.2,mat(0xdc2626),0,1.65,0);
 }

 return group;
}

function createCoin(){
 const group=new THREE.Group();

 const c=new THREE.Mesh(
  new THREE.TorusGeometry(.35,.12,10,20),gold
 );
 group.add(c);

 return group;
}

function addObstacle(type,l,z){
 const obj=type==="train"?createTrain():createBarrier(type);
 obj.position.set(l*2,0,z);
 scene.add(obj);
 obstacles.push({mesh:obj,lane:l,type});
}

function addCoin(l,z){
 const obj=createCoin();
 obj.position.set(l*2,1.2,z);
 scene.add(obj);
 coinObjects.push(obj);
}

function spawn(){
 const l=Math.floor(Math.random()*3)-1;
 const r=Math.random();

 if(r<.35){
  const free=Math.floor(Math.random()*3)-1;
  for(let x=-1;x<=1;x++){
   if(x!==free)addObstacle("train",x,-65);
  }
  for(let i=0;i<5;i++)addCoin(free,-62-i*2);
 }
 else if(r<.65){
  addObstacle("low",l,-65);
  for(let i=0;i<5;i++)addCoin(l,-60-i*2);
 }
 else if(r<.85){
  addObstacle("high",l,-65);
 }else{
  for(let i=0;i<8;i++)addCoin(l,-65-i*2);
 }
}

let spawnTimer=1;

function move(d){
 if(!running)return;
 lane=Math.max(-1,Math.min(1,lane+d));
}

function jump(){
 if(!running)return;
 if(jumpY===0){
  jumpV=12;
  sliding=0;
 }
}

function slide(){
 if(!running)return;
 sliding=.8;
 if(jumpY>0)jumpV=-15;
}

function reset(){
 obstacles.forEach(o=>scene.remove(o.mesh));
 coinObjects.forEach(o=>scene.remove(o));
 obstacles=[];
 coinObjects=[];

 lane=0;
 jumpY=0;
 jumpV=0;
 sliding=0;
 speed=17;
 distance=0;
 coins=0;
 spawnTimer=1;
 player.position.set(0,0,3);

 over=false;
 running=true;

 document.getElementById("menu").classList.add("hidden");
}

function endGame(){
 running=false;
 over=true;

 best=Math.max(best,Math.floor(distance));
 localStorage.setItem("railBest",best);

 document.getElementById("best").textContent=best;
 document.getElementById("message").textContent=
  "Distance: "+Math.floor(distance)+" m  |  Coins: "+coins;
 document.getElementById("start").textContent="PLAY AGAIN";
 document.getElementById("menu").classList.remove("hidden");
}

function update(dt){
 if(!running)return;

 distance+=speed*dt*.6;
 speed=Math.min(34,speed+dt*.22);

 spawnTimer-=dt;
 if(spawnTimer<=0){
  spawn();
  spawnTimer=1.35+Math.random()*.6;
 }

 player.position.x+=(lane*2-player.position.x)*Math.min(1,dt*12);

 jumpV-=30*dt;
 jumpY+=jumpV*dt;

 if(jumpY<0){
  jumpY=0;
  jumpV=0;
 }

 if(sliding>0)sliding-=dt;

 player.position.y=jumpY;

 const isSlide=sliding>0;
 player.scale.y+=(isSlide?.55:1-player.scale.y)*Math.min(1,dt*15);

 const run=Math.sin(performance.now()*.015);
 legs[0].rotation.x=run*.7;
 legs[1].rotation.x=-run*.7;
 arms[0].rotation.x=-run*.5;
 arms[1].rotation.x=run*.5;

 player.rotation.z+=(lane*-.06-player.rotation.z)*dt*8;

 // MOVE OBJECTS
 for(let o of obstacles){
  o.mesh.position.z+=speed*dt;

  if(!o.dead&&Math.abs(o.mesh.position.z-3)<1.15){
   if(o.lane===lane){
    if(o.type==="train")endGame();
    else if(o.type==="low"&&jumpY<1.25)endGame();
    else if(o.type==="high"&&!isSlide)endGame();
   }
   o.dead=true;
  }
 }

 for(let c of coinObjects){
  c.position.z+=speed*dt;
  c.rotation.y+=dt*4;

  if(!c.userData.got&&Math.abs(c.position.z-3)<1.1&&Math.abs(c.position.x-player.position.x)<.85){
   c.userData.got=true;
   c.visible=false;
   coins++;
  }
 }

 obstacles=obstacles.filter(o=>{
  if(o.mesh.position.z>12){
   scene.remove(o.mesh);
   return false;
  }
  return true;
 });

 coinObjects=coinObjects.filter(c=>{
  if(c.position.z>12){
   scene.remove(c);
   return false;
  }
  return true;
 });

 // SLEEPER ANIMATION
 for(let s of sleepers){
  s.position.z+=speed*dt;
  if(s.position.z>12)s.position.z-=150;
 }

 // HUD
 document.getElementById("score").textContent=Math.floor(distance)+" m";
 document.getElementById("coins").textContent=coins;
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 update(dt);

 camera.position.x+=(player.position.x*.12-camera.position.x)*dt*3;
 camera.lookAt(player.position.x*.1,1,-13);

 renderer.render(scene,camera);
}

animate();

// CONTROLS
document.getElementById("start").onclick=reset;
document.getElementById("left").onclick=()=>move(-1);
document.getElementById("right").onclick=()=>move(1);
document.getElementById("jump").onclick=jump;
document.getElementById("slide").onclick=slide;

let sx=0,sy=0;
renderer.domElement.addEventListener("pointerdown",e=>{
 sx=e.clientX;sy=e.clientY;
});

renderer.domElement.addEventListener("pointerup",e=>{
 if(!running)return;

 const dx=e.clientX-sx;
 const dy=e.clientY-sy;

 if(Math.abs(dx)>25||Math.abs(dy)>25){
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);
  else if(dy<0)jump();
  else slide();
 }
});

addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))
 e.preventDefault();

 if(!running)return;

 if(e.key==="ArrowLeft"||e.key==="a")move(-1);
 if(e.key==="ArrowRight"||e.key==="d")move(1);
 if(e.key==="ArrowUp"||e.key==="w"||e.key===" ")jump();
 if(e.key==="ArrowDown"||e.key==="s")slide();
});

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
